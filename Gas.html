<!DOCTYPE html>
<html>
<head>
<title>Sydney Cheapest Petrol</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.card{
background:white;
padding:20px;
margin:20px auto;
width:300px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.price{
font-size:28px;
color:#0077ff;
font-weight:bold;
}
</style>

</head>

<body>

<h1>Cheapest Petrol in Sydney</h1>
<button onclick="showStations()">Show Cheapest Stations</button>

<div id="results"></div>

<script>

const stations = [
{name:"United Petersham",price:"169.9 c/L"},
{name:"Metro Alexandria",price:"171.9 c/L"},
{name:"BP Tempe",price:"172.4 c/L"},
{name:"Shell Five Dock",price:"173.1 c/L"}
];

function showStations(){

let results=document.getElementById("results")
results.innerHTML=""

stations.forEach(station=>{
results.innerHTML+=`
<div class="card">
<h3>${station.name}</h3>
<div class="price">${station.price}</div>
</div>
`
})

}

</script>

</body>
</html>
